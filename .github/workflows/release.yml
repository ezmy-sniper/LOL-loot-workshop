name: Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: ./build.ps1
        shell: pwsh
      - name: Package executable and documentation
        shell: pwsh
        run: |
          Copy-Item README.md,LICENSE,CHANGELOG.md dist/
          Copy-Item third_party dist/third_party -Recurse
          Compress-Archive -Path dist/* -DestinationPath LoLLootWorkshop-Windows.zip
          $assetHash = (Get-FileHash LoLLootWorkshop-Windows.zip -Algorithm SHA256).Hash.ToLower()
          "$assetHash  LoLLootWorkshop-Windows.zip" | Set-Content SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: LoLLootWorkshop-Windows
          path: |
            LoLLootWorkshop-Windows.zip
            SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" LoLLootWorkshop-Windows.zip SHA256SUMS.txt --title "${{ github.ref_name }} · 英雄碎片工坊" --notes-file RELEASE_NOTES.md
    permissions:
      contents: write
