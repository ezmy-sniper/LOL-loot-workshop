[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lol-loot-workshop"
version = "1.1.0"
description = "Preview-first desktop tool for crafting and disenchanting League champion shards"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Games/Entertainment",
]

[project.scripts]
lol-loot-workshop = "loot_workshop.gui:main"

[tool.setuptools.packages.find]
include = ["loot_workshop*"]
